apiVersion: v1
kind: ServiceMonitor
metadata:
  name: rl-training-monitor
  namespace: rl-trading
  labels:
    app: rl-training
spec:
  selector:
    matchLabels:
      app: rl-training
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
---
apiVersion: v1
kind: ServiceMonitor
metadata:
  name: rl-inference-monitor
  namespace: rl-trading
  labels:
    app: rl-inference
spec:
  selector:
    matchLabels:
      app: rl-inference
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: rl-trading
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
        - name: prometheus-data
          mountPath: /prometheus
        args:
        - '--config.file=/etc/prometheus/prometheus.yml'
        - '--storage.tsdb.path=/prometheus'
        - '--web.console.libraries=/etc/prometheus/console_libraries'
        - '--web.console.templates=/etc/prometheus/consoles'
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config
      - name: prometheus-data
        persistentVolumeClaim:
          claimName: prometheus-pvc
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: rl-trading
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    scrape_configs:
    - job_name: 'rl-training'
      static_configs:
      - targets: ['rl-training-service:8080']
      metrics_path: /metrics
      scrape_interval: 30s
    
    - job_name: 'rl-inference'
      static_configs:
      - targets: ['rl-inference-service:80']
      metrics_path: /metrics
      scrape_interval: 15s
    
    - job_name: 'redis'
      static_configs:
      - targets: ['redis-service:6379']
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
  namespace: rl-trading
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: rl-trading
spec:
  selector:
    app: prometheus
  ports:
  - name: prometheus
    port: 9090
    targetPort: 9090
  type: ClusterIP