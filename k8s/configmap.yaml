apiVersion: v1
kind: ConfigMap
metadata:
  name: rl-config
  namespace: rl-trading
data:
  config.json: |
    {
      "training": {
        "batch_size": 256,
        "learning_rate": 0.0003,
        "max_episodes": 10000,
        "checkpoint_frequency": 100,
        "evaluation_frequency": 500
      },
      "environment": {
        "lookback_window": 50,
        "transaction_cost": 0.0001,
        "max_position_size": 0.1
      },
      "distributed": {
        "num_workers": 4,
        "sync_frequency": 10,
        "gradient_compression": true
      },
      "monitoring": {
        "metrics_port": 8080,
        "log_level": "INFO",
        "tensorboard_port": 6006
      }
    }
  redis.conf: |
    bind 0.0.0.0
    port 6379
    maxmemory 2gb
    maxmemory-policy allkeys-lru